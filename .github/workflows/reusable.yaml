# .github/workflows/reusable-prepare-release.yml
name: Reusable Prepare Release Workflow

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      private_key:
        required: true
        type: string

    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v2

      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ inputs.app_id }}
          private_key: ${{ inputs.private_key }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up Java 11
        uses: actions/setup-java@v1
        with:
          java-version: 11

      - name: Run Prepare Release Script
        id: prepare-release
        run: |
          export MY_POM_VERSION=$(mvn -q -Dexec.executable="echo" -Dexec.args='${projects.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:1.3.1:exec)
          if [[ $MY_POM_VERSION =~ ^.*SNAPSHOT$ ]]; then
            . ./CI/prepare-release.sh
            echo "PREPARE_RELEASE_OK=yes" >> $GITHUB_ENV
          else
            echo "Not preparing release for version: ${MY_POM_VERSION}"
            echo "PREPARE_RELEASE_OK=no" >> $GITHUB_ENV
          fi
          echo "SC_VERSION=$SC_VERSION" >> $GITHUB_ENV
          echo "SC_NEXT_VERSION=$SC_NEXT_VERSION" >> $GITHUB_ENV

      - name: Create Prepare Release Pull Request
        uses: peter-evans/create-pull-request@v4
        if: env.PREPARE_RELEASE_OK == 'yes'
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: prepare release ${{ env.SC_VERSION }}
          title: "prepare release ${{ env.SC_VERSION }}"
          branch: prepare-release-${{ env.SC_VERSION }}
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      SC_VERSION:
      SC_NEXT_VERSION:
